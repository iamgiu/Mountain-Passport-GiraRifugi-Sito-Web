{% extends 'base.html' %}
{% block title %}Check-in — GiraRifugi{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Check-in rifugio</h2>
    <p style="color:var(--gray); margin-bottom:1.5rem; font-size:0.9rem;">
        Inserisci il codice del rifugio che ti ha fornito il gestore per ottenere il tuo timbro!
    </p>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Codice rifugio</label>
            <input type="text" name="codice" placeholder="es. A3F9B2C1" maxlength="8" 
                   style="text-transform:uppercase; letter-spacing:3px; font-size:1.2rem; text-align:center;" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">
            <span class="material-icons" style="font-size:1rem; vertical-align:middle;">qr_code_scanner</span>
            Effettua Check-in
        </button>
    </form>
</div>
{% endblock %}
