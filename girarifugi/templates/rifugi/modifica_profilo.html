{% extends 'base.html' %}
{% block title %}Modifica Profilo — GiraRifugi{% endblock %}

{% block content %}

<div class="form-container" style="max-width:600px;">
    <h2>Modifica Profilo</h2>
    <form method="post">
        {% csrf_token %}

        <h3 class="section-title" style="font-size:1rem; margin-bottom:1rem;">Informazioni personali</h3>

        <div class="prenota-grid">
            <div class="form-group">
                <label>Nome</label>
                <input type="text" name="first_name" value="{{ user.first_name }}">
            </div>
            <div class="form-group">
                <label>Cognome</label>
                <input type="text" name="last_name" value="{{ user.last_name }}">
            </div>
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" value="{{ user.username }}" disabled style="opacity:0.6; cursor:not-allowed;">
            <p class="helptext">Il nome utente non può essere modificato.</p>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ user.email }}">
        </div>

        <h3 class="section-title" style="font-size:1rem; margin:1.5rem 0 1rem;">Cambia password</h3>
        <p class="helptext" style="margin-bottom:1rem;">Lascia vuoto se non vuoi cambiare la password.</p>

        <div class="form-group">
            <label>Nuova password</label>
            <input type="password" name="nuova_password" placeholder="Nuova password">
        </div>

        <div style="display:flex; gap:0.75rem; margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary">Salva modifiche</button>
            <a href="{% url 'passaporto' %}" class="btn btn-outline">Annulla</a>
        </div>
    </form>
</div>

{% endblock %}
